<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>เข้าเวร GPS เรียลไทม์ - BCN CONNECT</title>
  
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1jXMKdfbvsGFMhH2jQq0prKrGASVwnHhq">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#dbeafe">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="auth.js"></script>

  <style>
    * { 
      font-family: 'Prompt', -apple-system, BlinkMacSystemFont, sans-serif !important; 
      box-sizing: border-box; 
    }
    body {
      background: radial-gradient(circle at 10% 18%, #cbe5fc 0%, #ded7fc 38%, #f7d8fc 72%, #fde4f3 100%);
      min-height: 100vh;
      color: #1e293b;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border-radius: 40px;
      border: 2px solid rgba(255, 255, 255, 1);
      box-shadow: 0 20px 45px -10px rgba(99, 102, 241, 0.16);
    }
  </style>
</head>
<body class="flex flex-col justify-between items-center min-h-screen p-3.5 sm:p-6 md:p-8 select-none pb-24">

  <div class="w-full max-w-md mx-auto space-y-4">
    
    <!-- แถบด้านบน: ปุ่มย้อนกลับ + หัวข้อ + ปุ่ม Admin (แสดงเฉพาะ Admin) -->
    <div class="flex items-center justify-between px-2">
      <a href="index.html" class="w-10 h-10 rounded-2xl bg-white/90 hover:bg-white flex items-center justify-center text-slate-700 shadow-sm border border-white active:scale-95 transition">
        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </a>
      <h1 class="text-sm font-black text-slate-800">ระบบเข้าเวร GPS เรียลไทม์</h1>
      
      <button onclick="toggleAdminPanel()" id="btnAdminIcon" class="hidden w-9 h-9 rounded-full bg-white/60 hover:bg-white flex items-center justify-center text-slate-400 hover:text-indigo-600 transition shadow-xs">
        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      </button>
    </div>

    <!-- บัตรหน้าจอหลัก -->
    <div class="glass-card p-6 text-center space-y-4">
      <div class="w-20 h-20 mx-auto rounded-3xl bg-indigo-50 border border-indigo-100 flex items-center justify-center text-4xl shadow-inner">
        📍
      </div>

      <div>
        <div class="text-xs font-bold text-indigo-600" id="currentDateDisplay">กำลังโหลดวันที่...</div>
        <div class="text-3xl font-black text-slate-900 mt-1 font-mono tracking-tight" id="clockDisplay">--:--:--</div>
      </div>

      <!-- กล่องสถานะพิกัด GPS -->
      <div class="p-3 bg-slate-50 border border-slate-200/80 rounded-2xl text-left space-y-1 text-xs">
        <div class="flex justify-between font-bold text-slate-700">
          <span>พิกัด GPS จริง:</span>
          <span id="gpsStatusText" class="text-amber-600 font-semibold">กำลังตรวจสอบ...</span>
        </div>
        <div id="gpsCoordsText" class="font-mono text-[11px] text-slate-500 truncate">กำลังเชื่อมต่อดาวเทียม GPS...</div>
      </div>

      <button onclick="handleCheckIn()" id="btnCheckIn" class="w-full py-3.5 bg-gradient-to-r from-emerald-500 to-teal-600 hover:opacity-95 text-white font-bold rounded-2xl text-sm shadow-md shadow-emerald-500/25 active:scale-95 transition">
        บันทึกเข้าเวร (ลงชื่อพร้อมพิกัด)
      </button>

      <div class="pt-2 text-[11px] text-slate-400">
        เข้าสู่ระบบในชื่อ: <span class="font-bold text-slate-700" id="currentUserDisplay">--</span>
      </div>
    </div>

    <!-- แผงตั้งค่า Admin (ซ่อนอยู่ จะเปิดเมื่อกดไอคอนเฟืองและเป็น Admin) -->
    <div id="adminPanel" class="glass-card p-5 space-y-3 hidden border-indigo-200">
      <div class="flex items-center justify-between border-b pb-2">
        <h3 class="text-xs font-black text-indigo-900">แผงควบคุมระบบเข้าเวร (เฉพาะ Admin)</h3>
        <span class="text-[10px] bg-indigo-100 text-indigo-800 font-bold px-2 py-0.5 rounded-full">ตั้งเวลา</span>
      </div>

      <div class="space-y-2 text-xs">
        <div class="flex items-center justify-between">
          <label class="font-bold text-slate-700">เปิดรับการเช็คอิน</label>
          <input type="checkbox" id="cfgEnabled" class="w-4 h-4 text-indigo-600 rounded">
        </div>
        <div class="grid grid-cols-2 gap-2 pt-1">
          <div>
            <label class="block text-[11px] font-bold text-slate-600 mb-1">เวลาเริ่ม (น.)</label>
            <input type="time" id="cfgStartTime" class="w-full border rounded-xl p-2 bg-white font-semibold">
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-600 mb-1">เวลาสิ้นสุด (น.)</label>
            <input type="time" id="cfgEndTime" class="w-full border rounded-xl p-2 bg-white font-semibold">
          </div>
        </div>
        <button onclick="saveAdminSettings()" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs mt-2 shadow-sm transition">
          บันทึกการตั้งค่าเวลา
        </button>
      </div>
    </div>

  </div>

  <script>
    let currentUser = null;
    let currentCoords = "";

    window.onload = function() {
      currentUser = requireLogin();
      if (!currentUser) return;
      document.getElementById('currentUserDisplay').textContent = currentUser.name;
      // ปุ่มนี้แค่ซ่อน/แสดง UI — สิทธิ์จริงตรวจที่เซิร์ฟเวอร์
      if (currentUser.isAdmin) document.getElementById('btnAdminIcon').classList.remove('hidden');
      startClock();
      fetchGpsLocation();
    };

    function startClock() {
      setInterval(() => {
        const now = new Date();
        document.getElementById('clockDisplay').textContent = now.toTimeString().split(' ')[0];
        document.getElementById('currentDateDisplay').textContent = now.toLocaleDateString('th-TH', { 
          year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' 
        });
      }, 1000);
    }

    // ดึงพิกัด GPS จริงจากอุปกรณ์
    function fetchGpsLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            currentCoords = `${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)}`;
            document.getElementById('gpsStatusText').textContent = "พิกัดแม่นยำ (Active)";
            document.getElementById('gpsStatusText').className = "text-emerald-600 font-bold";
            document.getElementById('gpsCoordsText').textContent = currentCoords;
          },
          (err) => {
            document.getElementById('gpsStatusText').textContent = "ไม่พบพิกัด";
            document.getElementById('gpsCoordsText').textContent = "กรุณากดเปิดสิทธิ์เข้าถึงตำแหน่ง (GPS) บนอุปกรณ์";
          },
          { enableHighAccuracy: true, timeout: 10000 }
        );
      }
    }

    // กดปุ่มบันทึกเวลาเข้าเวร (เซิร์ฟเวอร์ใช้อีเมลจาก token ไม่ใช่ค่าที่ส่งมา)
    async function handleCheckIn() {
      if (!currentCoords) {
        Swal.fire({ icon: 'warning', title: 'ยังไม่พบพิกัด GPS', text: 'กรุณาเปิดสิทธิ์ระบุตำแหน่งบนอุปกรณ์ก่อนลงชื่อ' });
        return fetchGpsLocation();
      }

      Swal.fire({ title: 'กำลังบันทึกเวลา...', didOpen: () => Swal.showLoading() });
      try {
        const d = await apiPost('recordGpsAttendance', { name: currentUser.name, coords: currentCoords });
        if (d.authRequired) return;
        Swal.fire({ icon: d.success ? 'success' : 'error', title: d.message });
      } catch(e) {
        Swal.fire({ icon: 'error', title: 'การเชื่อมต่อขัดข้อง' });
      }
    }

    // ควบคุมแผง Admin
    async function toggleAdminPanel() {
      if (!currentUser || !currentUser.isAdmin) return;
      const panel = document.getElementById('adminPanel');
      if (panel.classList.contains('hidden')) {
        const cfg = await apiGet({ action: 'getSettings' });
        document.getElementById('cfgEnabled').checked = cfg.enabled;
        document.getElementById('cfgStartTime').value = cfg.startTime;
        document.getElementById('cfgEndTime').value = cfg.endTime;
        panel.classList.remove('hidden');
      } else {
        panel.classList.add('hidden');
      }
    }

    async function saveAdminSettings() {
      const payload = {
        enabled: document.getElementById('cfgEnabled').checked,
        startTime: document.getElementById('cfgStartTime').value,
        endTime: document.getElementById('cfgEndTime').value
      };
      Swal.fire({ title: 'กำลังบันทึก...', didOpen: () => Swal.showLoading() });
      const d = await apiPost('updateCheckinSettings', payload);
      if (d.authRequired) return;
      Swal.fire({ icon: d.success ? 'success' : 'error', title: d.message });
      if (d.success) toggleAdminPanel();
    }
  </script>
</body>
</html>
