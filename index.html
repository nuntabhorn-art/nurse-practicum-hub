<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>เข้าเวร | Nursenote</title>
<meta name="theme-color" content="#dbeafe">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.js"></script>
<style>
*{font-family:'Prompt',sans-serif!important;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(circle at 10% 18%,#cbe5fc 0%,#ded7fc 38%,#f7d8fc 72%,#fde4f3 100%);min-height:100vh;color:#1e293b}
.card{background:#fff;border-radius:32px;box-shadow:0 16px 32px -8px rgba(99,102,241,.14)}
.cam{position:relative;aspect-ratio:3/4;max-height:62vh;margin:auto;border-radius:36px;overflow:hidden;background:#110e35}
.cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.oval{position:absolute;inset:12% 17%;border:4px dashed rgba(255,255,255,.75);border-radius:50%;transition:.3s}
.oval.ok{border:4px solid #34d399;box-shadow:0 0 28px #34d399}
.oval.bad{border-color:#f87171}
.pulse{animation:p 1.2s infinite}@keyframes p{50%{opacity:.45}}
@media(prefers-reduced-motion:reduce){.pulse{animation:none}}
</style>
</head>
<body class="p-3.5 sm:p-6 pb-10">
<div class="max-w-md mx-auto space-y-3.5">

  <div class="flex items-center gap-3">
    <a href="index.html" class="w-11 h-11 rounded-full bg-white shadow flex items-center justify-center" aria-label="กลับหน้าแรก">
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="#4f46e5"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg>
    </a>
    <div class="min-w-0">
      <h1 class="text-lg font-extrabold leading-tight">เข้าเวร / ออกเวร</h1>
      <p id="who" class="text-xs text-slate-500 truncate">กำลังตรวจสอบบัญชี…</p>
    </div>
  </div>

  <!-- สถานะ GPS -->
  <div class="card p-4 flex items-center gap-3">
    <div id="gpsIco" class="w-11 h-11 rounded-2xl bg-slate-100 flex items-center justify-center shrink-0">
      <svg class="w-6 h-6" viewBox="0 0 24 24" fill="#64748b"><path d="M12 2a7 7 0 0 0-7 7c0 5.3 7 13 7 13s7-7.7 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
    </div>
    <div class="min-w-0 flex-1">
      <div id="gpsTitle" class="text-sm font-bold pulse">กำลังหาตำแหน่ง…</div>
      <div id="gpsSub" class="text-xs text-slate-500">กรุณาอนุญาตการเข้าถึงตำแหน่ง</div>
    </div>
  </div>

  <!-- กล้อง -->
  <div class="card p-3">
    <div class="cam">
      <video id="vid" autoplay playsinline muted></video>
      <div id="oval" class="oval"></div>
      <div id="camMsg" class="absolute bottom-3 inset-x-3 text-center text-sm font-semibold text-white bg-black/55 rounded-2xl py-2 px-3">กำลังโหลดระบบสแกนใบหน้า…</div>
    </div>
    <div class="grid grid-cols-2 gap-2 mt-3" role="group" aria-label="ประเภทการลงเวลา">
      <button id="tIn" onclick="setType('in')" class="py-2.5 rounded-2xl text-sm font-bold">เข้าเวร</button>
      <button id="tOut" onclick="setType('out')" class="py-2.5 rounded-2xl text-sm font-bold">ออกเวร</button>
    </div>
    <button id="btnScan" onclick="startScan()" disabled class="w-full mt-2.5 py-3.5 rounded-2xl text-white font-extrabold bg-gradient-to-r from-blue-600 to-indigo-600 shadow-lg shadow-blue-500/30 disabled:opacity-50 active:scale-[.98] transition">
      เริ่มสแกนใบหน้า
    </button>
    <button onclick="resetFace()" class="w-full mt-1 py-2 text-xs text-slate-400 font-semibold">ลบข้อมูลใบหน้าของฉัน</button>
  </div>

  <!-- ประวัติ -->
  <div class="card p-4">
    <h2 class="text-sm font-extrabold mb-2">ประวัติล่าสุด</h2>
    <div id="hist" class="space-y-2 text-sm"></div>
  </div>
</div>

<script>
/* ===== ตั้งค่า (แก้ได้) ===== */
const API_URL = "https://script.google.com/macros/s/AKfycbygTRS3dp8WQkGKpiRxKbsDdDjfQUAeZnHwid6PTX3ABskdSbQdbEBch7dkia3UlaSJ/exec";
// ⚠️ พิกัดด้านล่างเป็นค่าประมาณ — โปรดแก้เป็นพิกัดจริงของแหล่งฝึก (คลิกขวาที่ Google Maps > คัดลอกพิกัด)
const SITES = [
  { name: "วพบ.ชัยนาท",       lat: 15.1865, lng: 100.1262, r: 200 },
  { name: "รพ.ชัยนาทนเรนทร", lat: 15.1830, lng: 100.1330, r: 250 }
];
const MAX_ACCURACY = 100;   // เมตร: GPS เพี้ยนเกินนี้ไม่ให้เช็คอิน
const MATCH_DIST   = 0.5;   // ยิ่งน้อยยิ่งเข้มงวด
const MODEL_URL = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/";

/* ===== สถานะ ===== */
const $ = id => document.getElementById(id);
let user = null, pos = null, site = null, dist = null, type = "in", ready = false, busy = false;

try { user = JSON.parse(localStorage.getItem("nursenote_user_session")); } catch (e) {}
if (!user || !user.email || !user.token) {
  Swal.fire({ icon: "warning", title: "ยังไม่ได้เข้าสู่ระบบ", text: "กรุณาเข้าสู่ระบบด้วยอีเมลวิทยาลัยที่หน้าแรกก่อน", confirmButtonText: "ไปหน้าแรก" })
    .then(() => location.href = "index.html");
} else $("who").textContent = user.name + " • " + user.email;

const FACE_KEY = () => "nn_face_" + user.email, HIST_KEY = () => "nn_att_" + user.email;

function setType(t) {
  type = t;
  const on = "bg-indigo-600 text-white shadow", off = "bg-slate-100 text-slate-500";
  $("tIn").className = "py-2.5 rounded-2xl text-sm font-bold " + (t === "in" ? on : off);
  $("tOut").className = "py-2.5 rounded-2xl text-sm font-bold " + (t === "out" ? on : off);
}
setType("in");
const msg = t => $("camMsg").textContent = t;
const oval = c => $("oval").className = "oval " + (c || "");

/* ===== GPS ===== */
function haversine(a, b, c, d) {
  const R = 6371000, r = Math.PI / 180, dLa = (c - a) * r, dLo = (d - b) * r;
  const x = Math.sin(dLa / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function onPos(p) {
  pos = p.coords;
  let best = null;
  SITES.forEach(s => { const d = haversine(pos.latitude, pos.longitude, s.lat, s.lng); if (!best || d < best.d) best = { s, d }; });
  site = best.s; dist = best.d;
  const inside = dist <= site.r, accOk = pos.accuracy <= MAX_ACCURACY;
  $("gpsTitle").classList.remove("pulse");
  $("gpsTitle").textContent = inside ? "อยู่ในพื้นที่: " + site.name : "อยู่นอกพื้นที่ (ห่าง " + Math.round(dist) + " ม.)";
  $("gpsTitle").style.color = inside ? "#059669" : "#dc2626";
  $("gpsSub").textContent = (accOk ? "" : "สัญญาณ GPS ไม่แม่นยำ ") + "ความคลาดเคลื่อน ±" + Math.round(pos.accuracy) + " ม. • จุดใกล้สุด: " + site.name;
  $("gpsIco").style.background = inside && accOk ? "#d1fae5" : "#fee2e2";
  updateBtn();
}
function onPosErr(e) {
  $("gpsTitle").classList.remove("pulse");
  $("gpsTitle").textContent = "ใช้ตำแหน่งไม่ได้";
  $("gpsTitle").style.color = "#dc2626";
  $("gpsSub").textContent = e.code === 1 ? "เปิดสิทธิ์ตำแหน่งให้เบราว์เซอร์ในการตั้งค่า แล้วโหลดหน้าใหม่" : "เปิด GPS แล้วลองใหม่อีกครั้ง";
}
if ("geolocation" in navigator)
  navigator.geolocation.watchPosition(onPos, onPosErr, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
else onPosErr({ code: 0 });

function gpsOk() { return pos && pos.accuracy <= MAX_ACCURACY && dist <= site.r; }
function updateBtn() {
  const b = $("btnScan");
  b.disabled = busy || !ready || !user;
  b.textContent = localStorage.getItem(user && FACE_KEY()) ? "สแกนหน้าเพื่อ" + (type === "in" ? "เข้าเวร" : "ออกเวร") : "ลงทะเบียนใบหน้า (ครั้งแรก)";
}

/* ===== กล้อง + โมเดล ===== */
async function init() {
  try {
    const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: 640, height: 480 }, audio: false });
    $("vid").srcObject = s;
  } catch (e) { msg("เปิดกล้องไม่ได้ — อนุญาตการใช้กล้อง และเปิดผ่าน HTTPS"); return; }
  try {
    await Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
      faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
      faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
    ]);
    ready = true; msg("พร้อมสแกน — จัดหน้าให้อยู่ในกรอบ"); updateBtn();
  } catch (e) { msg("โหลดโมเดลสแกนใบหน้าไม่สำเร็จ ตรวจสอบอินเทอร์เน็ต"); }
}
if (user) init();

/* ===== สแกนหน้า (ตรวจกะพริบตากันภาพถ่าย) ===== */
const dd = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const ear = p => (dd(p[1], p[5]) + dd(p[2], p[4])) / (2 * dd(p[0], p[3]));

async function startScan() {
  const saved = localStorage.getItem(FACE_KEY());
  if (saved) {
    if (!gpsOk()) {
      return Swal.fire({ icon: "error", title: "เช็คอินไม่ได้", text: !pos ? "ยังไม่พบตำแหน่ง GPS" : pos.accuracy > MAX_ACCURACY ? "สัญญาณ GPS ไม่แม่นยำ ลองออกไปที่โล่งแล้วลองใหม่" : "คุณอยู่นอกพื้นที่ฝึก (ห่าง " + Math.round(dist) + " ม.)" });
    }
  } else {
    const c = await Swal.fire({
      icon: "info", title: "ลงทะเบียนใบหน้า",
      html: "<div class='text-sm text-left'>ระบบจะเก็บ<b>ค่าตัวเลขของใบหน้า</b> (ไม่เก็บรูปถ่าย) ไว้ในเครื่องของคุณ เพื่อใช้ยืนยันตัวตนตอนเช็คอิน ตามนโยบายคุ้มครองข้อมูลส่วนบุคคล (PDPA) คุณลบได้ทุกเมื่อ</div>",
      showCancelButton: true, confirmButtonText: "ยินยอม", cancelButtonText: "ยกเลิก"
    });
    if (!c.isConfirmed) return;
  }
  busy = true; updateBtn(); oval("");
  const opt = new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.5 });
  let desc = null, sawOpen = false, sawClosed = false, blinked = false, t0 = Date.now();
  msg("มองกล้อง แล้วกะพริบตา 1 ครั้ง");
  while (Date.now() - t0 < 15000) {
    const r = await faceapi.detectSingleFace($("vid"), opt).withFaceLandmarks().withFaceDescriptor();
    if (!r) { oval("bad"); msg("ไม่พบใบหน้า — จัดหน้าให้อยู่ในกรอบ"); continue; }
    oval("ok");
    const m = r.landmarks, e = (ear(m.getLeftEye()) + ear(m.getRightEye())) / 2;
    if (e > 0.27) { sawOpen = true; if (!blinked) desc = r.descriptor; if (sawClosed) blinked = true; }
    else if (e < 0.2 && sawOpen) sawClosed = true;
    if (blinked && desc) break;
    msg(sawOpen ? "กะพริบตา 1 ครั้ง" : "ลืมตามองกล้อง");
  }
  if (!(blinked && desc)) { busy = false; oval("bad"); msg("สแกนไม่สำเร็จ ลองใหม่อีกครั้ง"); updateBtn(); return; }

  if (!saved) {
    localStorage.setItem(FACE_KEY(), JSON.stringify(Array.from(desc)));
    busy = false; msg("ลงทะเบียนสำเร็จ"); updateBtn();
    return Swal.fire({ icon: "success", title: "ลงทะเบียนใบหน้าแล้ว", text: "กดสแกนอีกครั้งเพื่อเช็คอิน", timer: 2200, showConfirmButton: false });
  }
  const score = faceapi.euclideanDistance(desc, new Float32Array(JSON.parse(saved)));
  if (score > MATCH_DIST) { busy = false; oval("bad"); msg("ใบหน้าไม่ตรงกับที่ลงทะเบียน"); updateBtn(); return Swal.fire({ icon: "error", title: "ยืนยันตัวตนไม่ผ่าน", text: "ใบหน้าไม่ตรงกับที่ลงทะเบียนไว้" }); }
  if (!gpsOk()) { busy = false; updateBtn(); return Swal.fire({ icon: "error", title: "ตำแหน่งเปลี่ยนไป", text: "ตรวจสอบ GPS อีกครั้ง" }); }

  const rec = { time: new Date().toISOString(), type, site: site.name, lat: +pos.latitude.toFixed(6), lng: +pos.longitude.toFixed(6), acc: Math.round(pos.accuracy), dist: Math.round(dist), score: +score.toFixed(3) };
  msg("กำลังบันทึก…");
  let d;
  try {
    const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "checkIn", data: { token: user.token, ...rec } }) });
    d = await res.json();
  } catch (e) { d = { success: false, message: "เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ลองใหม่อีกครั้ง" }; }
  busy = false; updateBtn();
  if (!d.success) { oval("bad"); msg("บันทึกไม่สำเร็จ"); return Swal.fire({ icon: "error", title: "บันทึกไม่สำเร็จ", text: d.message }); }
  const h = JSON.parse(localStorage.getItem(HIST_KEY()) || "[]"); h.unshift(rec);
  localStorage.setItem(HIST_KEY(), JSON.stringify(h.slice(0, 30)));
  msg("บันทึกเวลาแล้ว"); renderHist();
  Swal.fire({ icon: "success", title: (type === "in" ? "เข้าเวร" : "ออกเวร") + "สำเร็จ", text: new Date().toLocaleTimeString("th-TH") + " • " + site.name, timer: 2500, showConfirmButton: false });
}

function resetFace() {
  Swal.fire({ icon: "question", title: "ลบข้อมูลใบหน้า?", text: "ต้องลงทะเบียนใหม่ในครั้งถัดไป", showCancelButton: true, confirmButtonText: "ลบ", cancelButtonText: "ยกเลิก" })
    .then(r => { if (r.isConfirmed) { localStorage.removeItem(FACE_KEY()); updateBtn(); } });
}

function renderHist() {
  if (!user) return;
  const h = JSON.parse(localStorage.getItem(HIST_KEY()) || "[]").slice(0, 6);
  $("hist").innerHTML = h.length ? h.map(r => {
    const d = new Date(r.time), inn = r.type === "in";
    return `<div class="flex items-center justify-between bg-slate-50 rounded-2xl px-3 py-2">
      <div><div class="font-bold ${inn ? "text-emerald-600" : "text-rose-500"}">${inn ? "เข้าเวร" : "ออกเวร"}</div>
      <div class="text-xs text-slate-500">${r.site} • ห่าง ${r.dist} ม.</div></div>
      <div class="text-right text-xs text-slate-500"><div class="font-semibold text-slate-700">${d.toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" })}</div>${d.toLocaleDateString("th-TH", { day: "numeric", month: "short" })}</div></div>`;
  }).join("") : '<p class="text-xs text-slate-400">ยังไม่มีประวัติ — สแกนหน้าเพื่อเริ่มลงเวลา</p>';
}
renderHist();
</script>
</body>
</html>
