<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>BCN Arena - คลังข้อสอบ 8 วิชาสภาการพยาบาล</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    * { font-family: 'Prompt', sans-serif; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background: linear-gradient(180deg, #1e1b4b 0%, #312e81 40%, #0f172a 100%); min-height: 100vh; color: white; font-size: 14px; }
    .glass-box { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.2); }
    @keyframes floatHero {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-8px) scale(1.02); }
    }
    .hero-float { animation: floatHero 2.5s ease-in-out infinite; }
  </style>
</head>
<body class="flex justify-center items-start pb-24">

  <div class="w-full max-w-md p-4 space-y-4">
    
    <!-- Header -->
    <div class="flex justify-between items-center bg-black/40 backdrop-blur-md p-3 rounded-2xl border border-white/10 shadow-lg">
      <div class="flex items-center gap-2">
        <a href="index.html" class="w-7 h-7 rounded-lg bg-white/20 flex items-center justify-center text-xs mr-1 text-white">
          <i class="fa-solid fa-arrow-left"></i>
        </a>
        <span class="font-extrabold text-sm text-amber-300">NURSE HERO ROV</span>
      </div>
      <div class="flex items-center gap-2 text-xs font-bold">
        <span class="px-3 py-1 bg-amber-500/30 border border-amber-400 rounded-full text-amber-300">
          🪙 <span id="coinDisplay">0</span>
        </span>
      </div>
    </div>

    <!-- ลานโชว์ตัวละครฮีโร่ / แถบหมวกวิชาชีพ -->
    <div class="glass-box rounded-3xl p-5 text-center relative overflow-hidden shadow-2xl">
      <div class="inline-block px-3 py-1 bg-indigo-600/60 rounded-full text-xs font-black border border-indigo-400/50 mb-2">
        <span id="rankBadgeText">Rank: หมวกขาวล้วน (Lv.1)</span>
      </div>

      <div class="w-28 h-28 mx-auto my-1 flex items-center justify-center hero-float">
        <div id="heroEmoji" class="text-6xl filter drop-shadow-[0_10px_20px_rgba(99,102,241,0.5)]">
          🐣
        </div>
      </div>

      <h2 id="heroNameText" class="text-base font-black text-white">น้องพยาบาลฝึกหัด</h2>
      <p class="text-xs text-indigo-200 mt-0.5">ตอบข้อสอบสะสม Coins เพื่ออัปเกรดแถบหมวกวิชาชีพ!</p>

      <div class="mt-3 text-left">
        <div class="flex justify-between text-[10px] font-bold text-indigo-200 mb-1">
          <span>ความก้าวหน้าสู่แถบหมวกขั้นถัดไป</span>
          <span id="expTextDisplay">0 / 150 EXP</span>
        </div>
        <div class="w-full bg-black/40 h-2.5 rounded-full overflow-hidden p-0.5 border border-white/10">
          <div id="expBarFill" class="bg-gradient-to-r from-amber-400 to-emerald-400 h-full rounded-full transition-all duration-500" style="width: 10%;"></div>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2 mt-4">
        <button onclick="feedAction(30, 20)" class="py-2 px-3 bg-gradient-to-r from-rose-500 to-pink-600 rounded-xl font-bold text-xs shadow-md active:scale-95 transition">
          🧪 ป้อนยา (-30🪙/+20 EXP)
        </button>
        <button onclick="feedAction(60, 50)" class="py-2 px-3 bg-gradient-to-r from-amber-500 to-orange-600 rounded-xl font-bold text-xs shadow-md active:scale-95 transition">
          📜 อ่านตำรา (-60🪙/+50 EXP)
        </button>
      </div>
    </div>

    <!-- ดันเจี้ยนข้อสอบ 8 วิชา -->
    <div class="glass-box rounded-3xl p-4 space-y-3">
      <div class="flex justify-between items-center border-b border-white/10 pb-2">
        <h3 class="font-bold text-xs text-white">⚔️ ดันเจี้ยนข้อสอบ 8 วิชาสภาการพยาบาล</h3>
        <span class="text-[9px] bg-emerald-500/20 text-emerald-300 border border-emerald-400/40 px-2 py-0.5 rounded-full font-bold">+Coins & EXP</span>
      </div>

      <div class="flex gap-1 overflow-x-auto pb-1 text-xs">
        <button onclick="loadQuestions('การพยาบาลผู้ใหญ่')" class="px-2.5 py-1 rounded-lg bg-indigo-600 text-white font-bold whitespace-nowrap">ผู้ใหญ่</button>
        <button onclick="loadQuestions('การพยาบาลมารดา ทารก และการผดุงครรภ์')" class="px-2.5 py-1 rounded-lg bg-white/10 text-slate-300 font-bold whitespace-nowrap">แม่และเด็ก</button>
        <button onclick="loadQuestions('การพยาบาลเด็กและวัยรุ่น')" class="px-2.5 py-1 rounded-lg bg-white/10 text-slate-300 font-bold whitespace-nowrap">เด็ก</button>
        <button onclick="loadQuestions('การพยาบาลอนามัยชุมชน')" class="px-2.5 py-1 rounded-lg bg-white/10 text-slate-300 font-bold whitespace-nowrap">ชุมชน</button>
      </div>

      <div id="quizBox" class="space-y-2.5">
        <div class="p-4 text-center text-indigo-200 text-xs font-semibold">กำลังโหลดข้อสอบจากคลัง...</div>
      </div>
    </div>

  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbygTRS3dp8WQkGKpiRxKbsDdDjfQUAeZnHwid6PTX3ABskdSbQdbEBch7dkia3UlaSJ/exec";

    const CAP_RANKS = [
      { lv: 1, name: "หมวกขาวล้วน", title: "น้องพยาบาลฝึกหัด (Pre-Clinic)", icon: "🐣", maxExp: 150 },
      { lv: 2, name: "แถบเฉียง 1 ขีด", title: "พยาบาลฝึกปฏิบัติวอร์ด (Junior Ward)", icon: "👩‍⚕️", maxExp: 300 },
      { lv: 3, name: "แถบเฉียง 2 ขีด", title: "พยาบาลชำนาญการเวชปฏิบัติ (Senior)", icon: "🩺", maxExp: 500 },
      { lv: 4, name: "หมวกแถบดำวิชาชีพ", title: "ผู้พิชิตสภาการพยาบาล (Board Master)", icon: "🦸‍♀️", maxExp: 800 }
    ];

    let currentStudentId = localStorage.getItem('current_student_id') || "STU-09";
    let studentData = null;

    window.onload = function() {
      loadStudentData();
      loadQuestions('การพยาบาลผู้ใหญ่');
    };

    async function loadStudentData() {
      try {
        const res = await fetch(`${API_URL}?action=getDashboard&studentId=${currentStudentId}`);
        const data = await res.json();
        if (data.studentInfo) {
          studentData = data.studentInfo;
          updateUI(data.studentInfo);
        }
      } catch(e) {}
    }

    function updateUI(stu) {
      document.getElementById('coinDisplay').textContent = stu.coins || 0;
      const lv = stu.level || 1;
      const rank = CAP_RANKS[Math.min(lv - 1, CAP_RANKS.length - 1)];
      document.getElementById('rankBadgeText').textContent = `Rank: ${rank.name} (Lv.${lv})`;
      document.getElementById('heroNameText').textContent = rank.title;
      document.getElementById('heroEmoji').textContent = rank.icon;
      document.getElementById('expTextDisplay').textContent = `${stu.exp || 0} / ${rank.maxExp} EXP`;
      document.getElementById('expBarFill').style.width = Math.min(100, Math.floor(((stu.exp || 0) / rank.maxExp) * 100)) + "%";
    }

    async function loadQuestions(sub) {
      const container = document.getElementById('quizBox');
      container.innerHTML = `<div class="p-4 text-center text-indigo-200 text-xs">กำลังโหลดข้อสอบ ${sub}...</div>`;

      try {
        const res = await fetch(`${API_URL}?action=getExamQuestions&subject=${encodeURIComponent(sub)}`);
        const list = await res.json();
        if (list.length === 0) {
          container.innerHTML = `<div class="p-4 text-center text-indigo-200 text-xs">ยังไม่มีข้อสอบในหมวดนี้</div>`;
          return;
        }

        const q = list[0];
        container.innerHTML = `
          <div class="bg-white/10 p-3.5 rounded-2xl border border-white/10 space-y-2">
            <div class="flex justify-between items-center text-[10px] font-bold text-amber-300">
              <span>${q.subject}</span>
              <span>+20 🪙 / +30 EXP</span>
            </div>
            <p class="text-xs text-white leading-relaxed font-semibold">${q.question}</p>
            <div class="space-y-1.5 pt-1 text-xs">
              <button onclick="checkAnswer('A', '${q.answer}', '${encodeURIComponent(q.explanation)}', '${encodeURIComponent(q.reference)}')" class="w-full text-left p-2.5 rounded-xl bg-white/10 hover:bg-white/20 transition">A. ${q.choiceA}</button>
              <button onclick="checkAnswer('B', '${q.answer}', '${encodeURIComponent(q.explanation)}', '${encodeURIComponent(q.reference)}')" class="w-full text-left p-2.5 rounded-xl bg-white/10 hover:bg-white/20 transition">B. ${q.choiceB}</button>
              <button onclick="checkAnswer('C', '${q.answer}', '${encodeURIComponent(q.explanation)}', '${encodeURIComponent(q.reference)}')" class="w-full text-left p-2.5 rounded-xl bg-white/10 hover:bg-white/20 transition">C. ${q.choiceC}</button>
              <button onclick="checkAnswer('D', '${q.answer}', '${encodeURIComponent(q.explanation)}', '${encodeURIComponent(q.reference)}')" class="w-full text-left p-2.5 rounded-xl bg-white/10 hover:bg-white/20 transition">D. ${q.choiceD}</button>
            </div>
          </div>
        `;
      } catch(e) {
        container.innerHTML = `<div class="p-4 text-center text-rose-400 text-xs">ไม่สามารถดึงข้อสอบได้</div>`;
      }
    }

    async function checkAnswer(selected, correct, expEnc, refEnc) {
      const exp = decodeURIComponent(expEnc);
      const ref = decodeURIComponent(refEnc);

      if (selected === correct) {
        await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'submitExamResult', data: { studentId: currentStudentId, coins: 20, exp: 30 } })
        });
        loadStudentData();
        Swal.fire({
          icon: 'success',
          title: 'ถูกต้อง! 🎉',
          html: `<div class="text-left text-xs space-y-1 mt-2 text-slate-800"><p class="font-bold text-emerald-700 bg-emerald-50 p-2 rounded-lg">${exp}</p><p class="text-slate-500">อ้างอิง: ${ref}</p><div class="font-black text-amber-600 text-center pt-1">+20 Coins และ +30 EXP!</div></div>`
        });
      } else {
        Swal.fire({
          icon: 'error',
          title: 'ยังไม่ถูกต้อง!',
          html: `<div class="text-left text-xs space-y-1 mt-2 text-slate-800"><p class="font-bold text-rose-700 bg-rose-50 p-2 rounded-lg">เฉลยข้อ ${correct}</p><p>${exp}</p><p class="text-slate-500">อ้างอิง: ${ref}</p></div>`
        });
      }
    }

    async function feedAction(cost, addExp) {
      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'feedHeroPet', data: { studentId: currentStudentId, cost: cost, addExp: addExp } })
      });
      const d = await res.json();
      if (d.success) {
        Swal.fire({ icon: 'success', title: 'ป้อนพลังสำเร็จ!', text: `+${addExp} EXP สู่แถบหมวกขั้นถัดไป` });
        loadStudentData();
      } else {
        Swal.fire({ icon: 'warning', title: d.message });
      }
    }
  </script>
</body>
</html>
