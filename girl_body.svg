<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160">
    <defs>
      <linearGradient id="bodyGrad_female" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="100%" stop-color="#e2e8f0"/>
      </linearGradient>
      <linearGradient id="collarGrad_female" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#38bdf8"/>
        <stop offset="100%" stop-color="#0284c7"/>
      </linearGradient>
      <filter id="bodyShadow_female" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.15"/>
      </filter>
    </defs>
    <!-- ไหล่และลำตัวชุดพยาบาลขาวคลีน -->
    <path d="M 40 150 C 40 85, 70 55, 100 55 C 130 55, 160 85, 160 150 Z" 
          fill="url(#bodyGrad_female)" filter="url(#bodyShadow_female)" stroke="#cbd5e1" stroke-width="2.5"/>
    <!-- คอเสื้อพยาบาล ปกฮาวาย/กะลาสี -->
    <path d="M 75 55 L 100 95 L 60 70 Z" fill="url(#collarGrad_female)" opacity="0.9"/>
    <path d="M 125 55 L 100 95 L 140 70 Z" fill="url(#collarGrad_female)" opacity="0.9"/>
    <!-- กระเป๋าเสื้อพร้อมปากกาและเข็มกลัดกาชาด -->
    <rect x="52" y="88" width="28" height="34" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="66" cy="105" r="7" fill="#ef4444"/>
    <path d="M 64 105 L 68 105 M 66 103 L 66 107" stroke="#ffffff" stroke-width="2"/>
    <!-- ปากกาเสียบกระเป๋า -->
    <rect x="57" y="78" width="4" height="14" rx="2" fill="#0284c7"/>
    <rect x="63" y="80" width="4" height="12" rx="2" fill="#ef4444"/>
  </svg>